name: Prompt snapshot

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run prompt:snapshot
      - run: git diff --exit-code -- PRE_SYSTEM_PROMPT.md
